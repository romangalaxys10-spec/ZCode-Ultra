name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  binaries:
    name: Standalone binary (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, arch: arm64, target: bun-darwin-arm64 }
          - { os: macos-latest, arch: x64, target: bun-darwin-x64 }
          - { os: ubuntu-latest, arch: x64, target: bun-linux-x64 }
          - { os: ubuntu-latest, arch: arm64, target: bun-linux-arm64 }
          - { os: windows-latest, arch: x64, target: bun-windows-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Compute asset name
        id: asset
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            macos-latest) OS_NAME="darwin" ;;
            ubuntu-latest) OS_NAME="linux" ;;
            *) OS_NAME="windows" ;;
          esac
          case "${{ matrix.os }}" in
            windows-latest) EXT=".exe" ;;
            *) EXT="" ;;
          esac
          echo "name=zcode-ultra-${OS_NAME}-${{ matrix.arch }}${EXT}" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck + build (JS)
        run: |
          npm run typecheck
          npm run build
      - name: Smoke test
        run: |
          node dist/index.js version
          node scripts/smoke.mjs
        shell: bash
      - name: Compile standalone binary (bun)
        shell: bash
        run: |
          bun build ./src/index.ts --compile --minify --target=${{ matrix.target }} --outfile "${{ steps.asset.outputs.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.asset.outputs.name }}
          retention-days: 7

  packages:
    name: Native packages (deb / rpm)
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-ubuntu-latest-x64
          path: ./pkg-asset
      - name: Build deb (dpkg-deb) + rpm (alien)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION_NUM="${VERSION#v}"
          ASSET=$(find pkg-asset -type f -name "zcode-ultra-linux-x64*" | head -1)
          # --- deb ---
          ROOT="pkg-root"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/share/doc/zcode-ultra"
          install -m 0755 "$ASSET" "$ROOT/usr/bin/zcode-ultra"
          cp README.md LICENSE "$ROOT/usr/share/doc/zcode-ultra/"
          {
            echo "Package: zcode-ultra"
            echo "Version: $VERSION_NUM"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Maintainer: ZCode Ultra Contributors <noreply@github.com>"
            echo "Description: Lean, multi-provider, bot-native coding agent harness"
            echo " Terminal AI coding agent with tools, subagents, memory, MCP and"
            echo " sandboxed execution, plus Discord and WhatsApp bots. Self-contained"
            echo " binary - no Node.js required."
            echo "Homepage: https://github.com/romangalaxys10-spec/ZCode-Ultra"
          } > "$ROOT/DEBIAN/control"
          mkdir -p packages
          dpkg-deb --build --root-owner-group "$ROOT" "packages/zcode-ultra_${VERSION_NUM}_amd64.deb"
          # --- rpm (alien converts the deb) ---
          sudo apt-get update -qq && sudo apt-get install -y -qq alien >/dev/null 2>&1
          cd packages && fakeroot alien --to-rpm "zcode-ultra_${VERSION_NUM}_amd64.deb" && cd ..
          ls -la packages/
      - uses: actions/upload-artifact@v4
        with:
          name: native-packages
          path: packages/*
          retention-days: 7

  npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Publish (requires NPM_TOKEN secret)
        if: env.NPM_TOKEN_SET == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish skipped
        if: env.NPM_TOKEN_SET != 'true'
        run: echo "NPM_TOKEN secret not configured - skip npm publish (add it in repo Settings > Secrets to enable)"
        env:
          NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN != '' }}

  github-release:
    name: Attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: [binaries, packages]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "zcode-ultra-*" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release/ \;
          chmod +x release/zcode-ultra-* 2>/dev/null || true
          ls -la release/
      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ZCode Ultra ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
